<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <!-- 须在最早执行：路径为 /u5、/u5/xxx 且无尾部斜杠时，否则 ./assets 会被解析成根路径 /assets -->
    <script>
      (function () {
        var m = location.pathname.match(/^\/(u\d+)(?=\/|$)/)
        if (!m) return
        var b = document.createElement('base')
        b.href = location.origin + '/' + m[1] + '/'
        document.head.insertBefore(b, document.head.firstChild)
      })()
    </script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Adbs</title>
  </head>
  <body>
    <noscript>请启用 JavaScript</noscript>
    <div id="app"></div>
  </body>
</html>
